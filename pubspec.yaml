name: v_chat_input_ui
description: A customizable Flutter chat composer with text, mentions, emoji, attachments, typing state, location sharing, and voice recording.
version: 3.2.0
homepage: https://v-chat-sdk.github.io/vchat-v2-docs/docs/intro
issue_tracker: https://github.com/v-chat-sdk/v_chat_input_ui/issues
repository: https://github.com/v-chat-sdk/v_chat_input_ui

topics:
  - chat
  - messaging
  - composer
  - voice-message
  - flutter-ui

screenshots:
  - description: V Chat Input UI running in the bundled example application.
    path: doc/screenshots/v_chat_input_ui_example.png

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  google_maps_flutter: ^2.18.0
  audio_waveforms: ^2.0.2
  permission_handler: ^13.0.1
  stop_watch_timer: ^3.2.2
  place_picker_v2: ^0.0.2
  #  google_maps_place_picker_mb: ^3.0.1
  latlong2: ^0.10.1
  cross_file: ^0.3.5+4
  #  record_without_android: ^5.1.1
  v_chat_mention_controller: ^1.0.0
  emoji_picker_flutter: ^4.5.3
  meta: ^1.18.0
  record: ^7.1.1
  intl: ^0.20.3
  v_platform: ^2.1.5
  cached_network_image: ^3.4.1
  adaptive_dialog: ^2.8.0
  path: ^1.9.1
  file_picker: ^12.0.0
  image_cropper: ^12.2.1
  wechat_camera_picker: ^4.6.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.1.0

flutter:

platforms:
  android:
  ios:
  web:
  windows:
  macos:
