name: v_chat_input_ui
description: A customizable Flutter chat composer with text, mentions, emoji, attachments, typing state, location sharing, and voice recording.
version: 4.1.0
homepage: https://v-chat-sdk.github.io/vchat-v2-docs/docs/intro
issue_tracker: https://github.com/v-chat-sdk/v_chat_input_ui/issues
repository: https://github.com/v-chat-sdk/v_chat_input_ui

topics:
  - chat
  - messaging
  - composer
  - voice-message
  - flutter-ui

screenshots:
  - description: Dark chat composer with text, emoji, attachments, and voice actions.
    path: images/1.png
  - description: Animated inline attachment tray with Media, Camera, Files, and Poll actions.
    path: images/2.png
  - description: Custom voice-recording interface with progress, duration, cancel, and send controls.
    path: images/3.png
  - description: Light chat composer with the responsive emoji picker open.
    path: images/4.png
  - description: V Chat Input UI running in the bundled example application.
    path: doc/screenshots/v_chat_input_ui_example.png

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  flutter:
    sdk: flutter
  # Chewie consumers still require the identical 1.x icon font.
  cupertino_icons: '>=1.0.9 <3.0.0'
  google_maps_flutter: ^2.19.0
  audio_waveforms: ^2.0.2
  permission_handler: ^13.0.2
  stop_watch_timer: ^3.2.2
  place_picker_v2: ^0.0.2
  #  google_maps_place_picker_mb: ^3.0.1
  latlong2: ^0.10.1
  # file_picker 13.x requires cross_file 0.3.x.
  cross_file: ^0.3.5+5
  #  record_without_android: ^5.1.1
  v_chat_mention_controller: ^2.0.1
  emoji_picker_flutter: ^4.5.4
  meta: ^1.19.0
  record: ^7.1.2
  intl: ^0.20.3
  v_platform: ^3.0.0
  cached_network_image: ^4.0.6
  adaptive_dialog: ^3.0.1
  path: ^1.9.1
  file_picker: ^13.3.2
  image_cropper: ^13.0.0
  wechat_camera_picker: ^4.6.0
  uuid: ^4.6.0
  path_provider: ^2.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.1.0

flutter:

platforms:
  android:
  ios:
  web:
  windows:
  macos:
